<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sancor Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one arcade screen centered on black, touch pad under it on phones. Single dark look on purpose. */
  :root {
    --bg: #000000;
    --screen: #04040a;
    --drone: #ffd9cf;
    --ufo: #ff3b3b;
    --cannon: #3cff5a;
    --dim: #8a8392;
    --pad: #15141c;
    --pad-edge: #2b2836;
    --font-arcade: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--drone);
    font-family: var(--font-arcade);
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .screen {
    --ctrl: 0px;
    width: min(100%, calc((100dvh - 24px - 44px - var(--ctrl)) * 0.875));
    aspect-ratio: 448 / 512;
    max-width: 100%;
    flex: none;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: var(--screen);
    border-radius: 6px;
    box-shadow: 0 0 0 1px #1c1a24, 0 0 60px rgba(255, 140, 120, .08);
    outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px var(--cannon); }
  .bar {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    width: min(100%, 448px);
    font-size: 8px;
    line-height: 1.6;
    color: var(--dim);
    letter-spacing: .04em;
  }
  .bar p { margin: 0; min-width: 0; }
  .mute {
    font: inherit;
    color: var(--drone);
    background: var(--pad);
    border: 1px solid var(--pad-edge);
    border-radius: 4px;
    padding: 6px 8px;
    cursor: pointer;
    flex: none;
  }
  .mute:focus-visible { outline: 2px solid var(--cannon); outline-offset: 2px; }
  .pad {
    display: none;
    width: min(100%, 448px);
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 10px;
  }
  .pad button {
    font: inherit;
    font-size: 14px;
    color: var(--cannon);
    background: var(--pad);
    border: 1px solid var(--pad-edge);
    border-radius: 10px;
    height: 72px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button.fire { color: var(--ufo); }
  .pad button.arrow { font-family: system-ui, sans-serif; font-size: 28px; }
  .pad button.on { background: var(--pad-edge); }
  @media (pointer: coarse) {
    .pad { display: grid; }
    .screen { --ctrl: 92px; }
    .keys { display: none; }
  }
</style>
</head>
<body>

<div class="screen"><canvas id="game" width="896" height="1024" tabindex="0" aria-label="Juego Space Invaders con drones"></canvas></div>
<div class="pad" id="pad">
  <button type="button" id="btn-left" class="arrow" aria-label="Mover a la izquierda">◀</button>
  <button type="button" id="btn-right" class="arrow" aria-label="Mover a la derecha">▶</button>
  <button type="button" id="btn-fire" class="fire" aria-label="Disparar">FUEGO</button>
</div>
<div class="bar">
  <p><span class="keys">FLECHAS mover · ESPACIO disparar · P pausa<br></span>Parodia no oficial. Sin relación con Sancor Seguros.</p>
  <button type="button" class="mute" id="mute" aria-pressed="false">SONIDO ON</button>
</div>

<script>
(() => {
  'use strict';
  const W = 448, H = 512, S = 2;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  ctx.imageSmoothingEnabled = false;
  const FONT = '"Press Start 2P", ui-monospace, monospace';
  const C = { drone: '#ffd9cf', glow: 'rgba(255,150,130,.95)', ufo: '#ff3b3b', cannon: '#3cff5a', white: '#f4f0ff', dim: '#8a8392' };
  const GOLD = { light: '#ffe58a', mid: '#f5c22b', dark: '#c98a00' };

  // ---------- Drone-dot shapes ----------
  const GLYPHS = {
    S: ['.###.', '#...#', '#....', '.###.', '....#', '#...#', '.###.'],
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    N: ['#...#', '##..#', '##..#', '#.#.#', '#..##', '#..##', '#...#'],
    C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    G: ['.###.', '#...#', '#....', '#.###', '#...#', '#...#', '.###.'],
    U: ['#...#', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
  };
  const SW = 24, SH = 28; // base glyph box (logical px at scale 1)

  // all dot lists are in logical px, already scaled
  function glyphDots(ch, sc = 1) {
    const d = [];
    GLYPHS[ch].forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') d.push([(4 + x * 4) * sc, (2 + y * 4) * sc]); }));
    return d;
  }
  function lineDots(d, x1, y1, x2, y2, gap) {
    const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / gap));
    for (let i = 0; i <= n; i++) d.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
  }
  function logoDots(sc = 1, gap = 4) {
    // A loose take on the round emblem from the drone show: ring, two triangles, a crossing line.
    const d = [], cx = 12 * sc, cy = 14 * sc, r = 11 * sc;
    const n = Math.round(Math.PI * 2 * r / gap);
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; d.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    const L = (a, b, c, e, g = gap) => lineDots(d, a * sc, b * sc, c * sc, e * sc, g);
    L(8, 5, 8, 11); L(8, 5, 15, 9); L(8, 11, 15, 9);
    L(4, 15.5, 20, 13, gap * 1.05);
    L(10, 18, 16, 18); L(10, 18, 14, 23); L(16, 18, 14, 23);
    // drop near-duplicates where lines meet
    return d.filter((p, i) => !d.slice(0, i).some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < gap * .55));
  }
  const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  // every drone drifts a little on the second march frame, like it is holding position in the wind
  const jitter = (i, x, y) => [(hash(i, x) - .5) * 1.6, (hash(y, i) - .5) * 1.6];

  function makeSprite(dots, frame, color, glow, w, h, r = 1.35) {
    const pad = 4, cw = Math.ceil(w + pad * 2), ch = Math.ceil(h + pad * 2);
    const c = document.createElement('canvas'); c.width = cw * S; c.height = ch * S;
    const g = c.getContext('2d'); g.scale(S, S);
    g.fillStyle = color; g.shadowColor = glow; g.shadowBlur = 5;
    dots.forEach(([x, y], i) => {
      const [jx, jy] = frame ? jitter(i, x, y) : [0, 0];
      g.beginPath(); g.arc(pad + x + jx, pad + y + jy, r, 0, Math.PI * 2); g.fill();
    });
    return { c, w: cw, h: ch, pad };
  }
  function makeDot(color, glow, r) {
    const size = 14, c = document.createElement('canvas'); c.width = c.height = size * S;
    const g = c.getContext('2d'); g.scale(S, S);
    g.fillStyle = color; g.shadowColor = glow; g.shadowBlur = 5;
    g.beginPath(); g.arc(size / 2, size / 2, r, 0, Math.PI * 2); g.fill();
    return { c, size };
  }
  // 0: Sancor sign; 1-4: the portrait's warm face and cool hair/suit, each lit and shaded
  const DOT_COL = [C.drone, '#ffc08a', '#f08a4a', '#eef2ff', '#8ea6ff'];
  const DOTS = [makeDot(C.drone, C.glow, 1.7), makeDot(DOT_COL[1], 'rgba(255,140,60,.9)', 1.25), makeDot(DOT_COL[2], 'rgba(240,110,40,.9)', 1.2),
    makeDot(DOT_COL[3], 'rgba(170,190,255,.9)', 1.25), makeDot(DOT_COL[4], 'rgba(110,140,255,.9)', 1.2)];

  // small sprites for the title screen
  const SPR = {};
  for (const ch of [...Object.keys(GLYPHS), '@']) {
    const dots = ch === '@' ? logoDots(1, 4) : glyphDots(ch);
    SPR[ch] = [0, 1].map(f => makeSprite(dots, f, C.drone, C.glow, SW, SH));
  }

  const LS = 1.35, LOGO_S = 2.85, PITCH = 34, LINE2 = 46, TEXT_X = 76, TILT = .11;
  function buildSancor() {
    const items = [];
    const add = (ch, x, y, sc, pts, kind) => {
      const raw = ch === '@' ? logoDots(sc, 5.6) : glyphDots(ch, sc);
      const dots = raw.map(([dx, dy], i) => ({ x: x + dx, y: y + dy - (x + dx) * TILT, alive: true, i, c: 0 }));
      items.push({ ch, kind, pts, dots, total: dots.length, alive: true, hits: kind === 'logo' ? 5 : 3,
        col: kind === 'logo' ? -1 : Math.round((x - TEXT_X) / PITCH), row: kind === 'bottom' ? 1 : 0 });
    };
    add('@', 0, 4, LOGO_S, 150, 'logo');
    [...'SANCOR'].forEach((ch, i) => add(ch, TEXT_X + i * PITCH, 0, LS, 30, 'top'));
    [...'SEGUROS'].forEach((ch, i) => add(ch, TEXT_X + i * PITCH, LINE2, LS, 20, 'bottom'));
    return items;
  }

      if (state === 'dying' && stateT > 110) {
        if (lives <= 0) { state = 'gameover'; stateT = 0; ufoSound(false); }
        else { player.x = W / 2 - PW / 2; player.dead = 0; aShots = []; state = 'playing'; stateT = 0; }
      }
      if (state === 'clear' && stateT > 110) { level++; newWave(); state = 'playing'; stateT = 0; }
      return;
    }

    // player
    if (keys.left) player.x -= 2.2;
    if (keys.right) player.x += 2.2;
    player.x = Math.max(16, Math.min(W - 16 - PW, player.x));
    if (firePressed && !pShot) { pShot = { x: player.x + PW / 2 - 1, y: PY - 6 }; shotsFired++; sfx.shoot(); }
    firePressed = false;

    // player shot
    if (pShot) {
      const prevY = pShot.y;
      pShot.y -= 8;
      if (pShot.y < 40) { popups.push({ x: pShot.x - 6, y: 42, txt: '*', life: 14, color: C.white }); pShot = null; }
      else if (starHit(pShot.x, pShot.y, 2, 8, 2)) pShot = null;
      else if (hitSign(pShot.x + 1, pShot.y, prevY + 8)) pShot = null;
      else if (ufo && pShot.y < ufo.y + UFO_H && pShot.y > ufo.y - 6 && pShot.x > ufo.x && pShot.x < ufo.x + UFO_W) {
        // classic trick: the 23rd shot and every 15th after pays 300
        const pts = (shotsFired === 23 || (shotsFired > 23 && (shotsFired - 23) % 15 === 0)) ? 300 : [50, 100, 150][Math.floor(Math.random() * 3)];
        addScore(pts); sfx.ufoKill(); ufoSound(false);
        burst(UFO_DOTS, ufo.x, ufo.y, CUP_GOLD);
        popups.push({ x: ufo.x, y: ufo.y + 10, txt: String(pts), life: 90, color: GLINT });
        ufo = null; pShot = null;
      }
    }
    for (const a of aShots) if (pShot && Math.abs(a.x - pShot.x) < 4 && Math.abs(a.y - pShot.y) < 10) {
      a.dead = true; popups.push({ x: a.x - 6, y: a.y, txt: '*', life: 10, color: C.white }); pShot = null;
    }

    // march: the fewer drones left, the faster the sign moves
    const live = liveDots();
    if (!live.length) { state = 'clear'; stateT = 0; ufoSound(false); ufo = null; return; }
    const frac = live.length / totalDots;
    const interval = Math.max(1, Math.round((1 + 41 * frac) * Math.pow(.93, level - 1)));
    if (++stepTimer >= interval) {
      stepTimer = 0; frame ^= 1; sfx.march(marchIdx++);
      if (dropNext) { oy += 12; dir *= -1; dropNext = false; }
      else {
        ox += dir * (frac < .07 ? 8 : 5);
        let minX = Infinity, maxX = -Infinity;
        for (const d of live) { minX = Math.min(minX, ox + d.x); maxX = Math.max(maxX, ox + d.x); }
        if ((dir > 0 && maxX >= W - 14) || (dir < 0 && minX <= 14)) dropNext = true;
      }
      signEatsStars(live);
      if (Math.max(...live.map(d => oy + d.y)) >= PY) { lives = 0; killPlayer(); return; }
    }

    // sign fire: from the lowest drone of an uncovered letter, or the emblem
    if (--aShotTimer <= 0 && aShots.length < 3) {
      const shooters = sign.filter(a => a.alive && !sign.some(b => b.alive && b.col === a.col && b.row > a.row));
      let a;
      const center = s => { const ds = s.dots.filter(d => d.alive); return ox + ds.reduce((m, d) => m + d.x, 0) / ds.length; };
      if (Math.random() < .45) {
        const pc = player.x + PW / 2;
        a = shooters.reduce((best, s) => Math.abs(center(s) - pc) < Math.abs(center(best) - pc) ? s : best);
      } else a = shooters[Math.floor(Math.random() * shooters.length)];
      const ds = a.dots.filter(d => d.alive);
      const low = ds.reduce((m, d) => d.y > m.y ? d : m, ds[0]);
      aShots.push({ x: a.kind === 'logo' ? ox + low.x : center(a), y: oy + low.y + 4, type: Math.floor(Math.random() * 3), speed: frac < .15 ? 3.2 : 2.2 });
      aShotTimer = Math.max(18, 64 - level * 5 - Math.floor((1 - frac) * 30));
    }
    for (const s of aShots) {
      if (s.dead) continue;
      s.y += s.speed;
      if (s.y > GROUND - 4) { s.dead = true; popups.push({ x: s.x - 6, y: GROUND - 10, txt: '*', life: 10, color: C.cannon }); continue; }
      if (starHit(s.x - 1, s.y, 3, 8, 2)) { s.dead = true; continue; }
      if (s.y + 8 > PY + 2 && s.y < PY + PH && s.x > player.x + 1 && s.x < player.x + PW - 1) { s.dead = true; killPlayer(); return; }
    }
    aShots = aShots.filter(s => !s.dead);

    // ufo
    if (ufo) {
      ufo.x += ufo.dir * 1.3;
      if (ufo.x < -40 || ufo.x > W + 10) { ufo = null; ufoSound(false); }
    } else if (--ufoTimer <= 0) {
      if (frac >= .2) { const d = Math.random() < .5 ? 1 : -1; ufo = { x: d > 0 ? -UFO_W - 4 : W + 4, y: 36, dir: d }; ufoSound(true); }
      ufoTimer = 1300 + Math.random() * 600;
    }
  }
  function killPlayer() {
    lives--; state = 'dying'; stateT = 0; pShot = null; ufoSound(false); sfx.die();
    const dots = [];
    CANNON.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#' && (x + y) % 2 === 0) dots.push([x * 2, y * 2]); }));
    dots.forEach(([dx, dy]) => drop(player.x + dx, PY + dy, dy < 6 || dy === 10 ? '#ffffff' : CELESTE));
    player.dead = 1;
  }
  function updateParticles() {
    for (const p of particles) { p.vy += .04; p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0 && p.y < H);
    for (const p of popups) p.life--;
    popups = popups.filter(p => p.life > 0);
  }

  // ---------- Draw ----------
  function text(str, x, y, color, size = 12, align = 'left') {
    ctx.font = size + 'px ' + FONT; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
    ctx.fillText(str, x, y);
  }
  const pad4 = n => String(n).padStart(4, '0');
  function drawSprite(sp, x, y, k = 1) { ctx.drawImage(sp.c, x - sp.pad * k, y - sp.pad * k, sp.w * k, sp.h * k); }
  function drawStars() {
    ctx.fillStyle = 'rgba(200,190,255,.35)';
    for (let i = 0; i < 40; i++) {
      const x = hash(i, 3) * W, y = 40 + hash(7, i) * 300;
      if ((t / 40 + i) % 9 > 1) ctx.fillRect(x, y, .8, .8);
    }
  }
  function drawHUD() {
    text('SCORE<1>', 24, 10, C.white, 10);
    text('HI-SCORE', W / 2, 10, C.white, 10, 'center');
    text('NIVEL', W - 24, 10, C.white, 10, 'right');
    text(pad4(score ?? 0), 44, 26, C.white, 10);
    text(pad4(hi), W / 2, 26, C.white, 10, 'center');
    text(String(level ?? 1).padStart(2, '0'), W - 24, 26, C.white, 10, 'right');
    ctx.fillStyle = C.cannon; ctx.fillRect(12, GROUND, W - 24, 2);
    const l = Math.max(0, lives ?? 3);
    text(String(l), 24, GROUND + 14, C.white, 10);
    for (let i = 0; i < Math.min(l - 1, 5); i++) ctx.drawImage(CANNON_IMG, 48 + i * 32, GROUND + 12, PW, PH);
    text('CREDITO 01', W - 24, GROUND + 14, C.white, 10, 'right');
  }
  function drawBullet(s) {
    ctx.fillStyle = C.white;
    const k = Math.floor(s.y / 4) % 2;
    if (s.type === 0) { for (let i = 0; i < 4; i++) ctx.fillRect(s.x - 1 + ((i + k) % 2 ? 1 : -1), s.y + i * 2, 2, 2); }
    else if (s.type === 1) { ctx.fillRect(s.x - .5, s.y, 1.5, 8); ctx.fillRect(s.x - 2.5, s.y + (k ? 0 : 6), 5, 1.5); }
    else { ctx.fillRect(s.x - .5, s.y, 1.5, 8); ctx.fillRect(s.x + (k ? -2 : 1), s.y + 3, 2, 1.5); }
  }
  function drawGoldStars() {
    for (const st of stars) {
      if (st.dirty) paintStar(st);
      ctx.drawImage(st.c, st.x, st.y, SGW * SCELL, SGH * SCELL);
    }
  }
  function drawSign() {
    for (const a of sign) if (a.alive) for (const d of a.dots) if (d.alive) {
      const [x, y] = dotPos(d), D = DOTS[d.c], h = D.size / 2;
      ctx.drawImage(D.c, x - h, y - h, D.size, D.size);
    }
  }
  function drawPlay() {
    drawSign();
    if (ufo) drawSprite(UFO_SPR[Math.floor(t / 10) % 2], ufo.x, ufo.y);
    drawGoldStars();
    if (!player.dead) ctx.drawImage(CANNON_IMG, player.x, PY, PW, PH);
    else if (state === 'dying' && stateT < 60 && Math.floor(stateT / 6) % 2) {
      ctx.globalAlpha = .6; ctx.drawImage(CANNON_IMG, player.x, PY, PW, PH); ctx.globalAlpha = 1;
    }
    if (pShot) { ctx.fillStyle = C.white; ctx.fillRect(pShot.x, pShot.y, 2, 8); }
    aShots.forEach(drawBullet);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of popups) text(p.txt, p.x, p.y, p.color, 10);
  }
  const TITLE_STARS = [W / 2 - 46, W / 2, W / 2 + 46];
  function drawTitleStar(cx, cy, R) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .41 : R;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fillStyle = GOLD.mid; ctx.fill();
  }
  function drawTitle() {
    const blink = Math.floor(t / 30) % 2 === 0;
    text('SPACE', W / 2, 62, C.drone, 26, 'center');
    text('INVADERS', W / 2, 98, C.drone, 26, 'center');
    text('EDICION SHOW DE DRONES', W / 2, 138, C.ufo, 10, 'center');
    [...'@SANCOR'].forEach((ch, i) => drawSprite(SPR[ch][Math.floor(t / 25 + i) % 2], 82 + i * 42, 166));
    [...'SEGUROS'].forEach((ch, i) => drawSprite(SPR[ch][Math.floor(t / 25 + i + 1) % 2], 82 + i * 42, 202));
    text('*TABLA DE PUNTOS*', W / 2, 244, C.white, 10, 'center');
    drawSprite(UFO_SPR[Math.floor(t / 20) % 2], 122, 259, .58); text('= ? LA COPA', 160, 276, C.white, 10);
    drawSprite(SPR['@'][0], 116, 306); text('= 150 EMBLEMA', 160, 316, C.white, 10);
    drawSprite(SPR.S[0], 116, 338); text('= 30 SANCOR', 160, 348, C.white, 10);
    drawSprite(SPR.E[0], 116, 370); text('= 20 SEGUROS', 160, 380, C.white, 10);
    TITLE_STARS.forEach(x => drawTitleStar(x, 418, 11));
    if (blink) text(matchMedia('(pointer: coarse)').matches ? 'TOCA PARA JUGAR' : 'ENTER PARA JUGAR', W / 2, 436, C.cannon, 10, 'center');
  }
  function draw() {
    ctx.fillStyle = '#04040a'; ctx.fillRect(0, 0, W, H);
    drawStars();
    if (state === 'title') drawTitle();
    else {
      drawPlay();
      if (state === 'gameover') {
        ctx.fillStyle = 'rgba(4,4,10,.6)'; ctx.fillRect(0, 160, W, 140);
        text('GAME OVER', W / 2, 190, C.ufo, 22, 'center');
        text('PUNTAJE ' + pad4(score), W / 2, 230, C.white, 10, 'center');
        if (Math.floor(t / 30) % 2 === 0) text(matchMedia('(pointer: coarse)').matches ? 'TOCA PARA SEGUIR' : 'ENTER PARA SEGUIR', W / 2, 264, C.cannon, 10, 'center');
      }
      if (state === 'paused') text('PAUSA', W / 2, 260, C.white, 18, 'center');
      if (state === 'clear' && stateT > 20) {
        text('NIVEL ' + level + ' SUPERADO', W / 2, 236, C.cannon, 12, 'center');
        if (stateT > 50) text('SIGUE: ' + LEVEL_NAME(level + 1), W / 2, 260, C.white, 10, 'center');
      }
      if (state === 'playing' && stateT < 120 && lives > 0) {
        text('NIVEL ' + level, W / 2, 300, C.white, 12, 'center');
        text(LEVEL_NAME(level), W / 2, 322, level % 2 ? C.drone : DOT_COL[1], 10, 'center');
      }
    }
    drawParticles();
    drawHUD();
  }

  // ---------- Loop ----------
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  function primary() {
    audio();
    if (state === 'title' || (state === 'gameover' && stateT > 40)) newGame();
  }
  function togglePause() {
    if (state === 'playing') { state = 'paused'; ufoSound(false); }
    else if (state === 'paused') { state = 'playing'; if (ufo) ufoSound(true); }
  }
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', ' ', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
    if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
      if (!e.repeat) { if (state === 'playing') firePressed = true; else primary(); }
    }
    if (k === 'Enter') primary();
    if (k === 'p' || k === 'P' || k === 'Escape') togglePause();
    if (k === 'm' || k === 'M') toggleMute();
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; if (state === 'playing') togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus(); if (state === 'paused') togglePause(); else primary(); });

  function hold(id, on, off) {
    const b = document.getElementById(id);
    const down = e => { e.preventDefault(); b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (_) {} on(); };
    const up = e => { e.preventDefault(); b.classList.remove('on'); off && off(); };
    b.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  hold('btn-left', () => { audio(); keys.left = true; }, () => { keys.left = false; });
  hold('btn-right', () => { audio(); keys.right = true; }, () => { keys.right = false; });
  hold('btn-fire', () => { if (state === 'playing') { audio(); firePressed = true; } else if (state === 'paused') togglePause(); else primary(); });

  const muteBtn = document.getElementById('mute');
  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? 'SONIDO OFF' : 'SONIDO ON';
    muteBtn.setAttribute('aria-pressed', String(muted));
    if (muted) ufoSound(false); else if (ufo && state === 'playing') { audio(); ufoSound(true); }
  }
  muteBtn.addEventListener('click', () => { audio(); toggleMute(); muteBtn.blur(); });

  const start = () => requestAnimationFrame(t0 => { last = t0; loop(t0); });
  (document.fonts && document.fonts.load ? document.fonts.load('12px "Press Start 2P"').catch(() => {}) : Promise.resolve()).then(start);
})();
</script>
</body>
